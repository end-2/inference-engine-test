apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-mps-smoke
spec:
  parallelism: 2
  completions: 2
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/mps.capable: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: cuda
          image: python:3.12-slim-bookworm
          command: [python, -u, /probe/probe.py]
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
              nvidia.com/gpu.shared: 1
          readinessProbe:
            exec:
              command: [test, -f, /tmp/mps-ready]
            periodSeconds: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: probe
              mountPath: /probe
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: probe
          configMap:
            name: gpu-mps-smoke
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
