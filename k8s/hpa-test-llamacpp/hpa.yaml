apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: base-metric-llamacpp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: base-metric-llamacpp
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
