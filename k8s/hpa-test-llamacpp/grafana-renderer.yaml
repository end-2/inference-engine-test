apiVersion: v1
kind: Secret
metadata:
  name: grafana-renderer-auth
  namespace: hpa-test-llamacpp
stringData:
  token: local-availability-renderer
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-renderer
  namespace: hpa-test-llamacpp
spec:
  ports:
  - name: http
    port: 8081
    targetPort: http
  selector:
    app: grafana-renderer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-renderer
  namespace: hpa-test-llamacpp
spec:
  replicas: 0
  selector:
    matchLabels:
      app: grafana-renderer
  template:
    metadata:
      labels:
        app: grafana-renderer
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: grafana-renderer-auth
        image: grafana/grafana-image-renderer:v5.12.3
        name: renderer
        ports:
        - containerPort: 8081
          name: http
        readinessProbe:
          tcpSocket:
            port: http
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "2"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /dev/shm
          name: shm
      nodeSelector:
        workload: monitor
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      volumes:
      - emptyDir:
          sizeLimit: 512Mi
        name: tmp
      - emptyDir:
          medium: Memory
          sizeLimit: 256Mi
        name: shm
