apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  labels: {{ .Values.labels | toYaml | nindent 4 }}
spec:
  {{- toYaml .Values.job | nindent 2 }}
  template:
    metadata:
      labels: {{ .Values.labels | toYaml | nindent 8 }}
    spec:
      {{- toYaml .Values.pod | nindent 6 }}
      containers:
        - {{- toYaml .Values.container | nindent 10 }}
