name: aiperf
namespace: ''
labels:
  app: aiperf
  benchmark: aiperf-cpu
job:
  activeDeadlineSeconds: 14400
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
pod:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
  terminationGracePeriodSeconds: 60
  volumes:
  - hostPath:
      path: /models/smollm2-135m
      type: Directory
    name: tokenizer
  - name: results
    persistentVolumeClaim:
      claimName: aiperf-results
  - emptyDir:
      sizeLimit: 1Gi
    name: tmp
container:
  args:
  - profile
  - --model
  - $(MODEL_ID)
  - --tokenizer
  - /tokenizer
  - --url
  - $(API_URL)
  - --endpoint-type
  - chat
  - --streaming
  - --use-server-token-count
  - --sequence-distribution
  - 64,32:50;256,64:50
  - --num-dataset-entries
  - $(DATASET_ENTRIES)
  - --random-seed
  - '42'
  - --parameter-sweep-same-seed
  - --dataset-sampling-strategy
  - sequential
  - --extra-inputs
  - ignore_eos:true
  - --concurrency
  - $(CONCURRENCIES)
  - --workers-max
  - '1'
  - --warmup-request-count
  - '2'
  - --warmup-concurrency
  - '1'
  - --request-count
  - '100'
  - --request-timeout-seconds
  - '3600'
  - --no-server-metrics
  - --ui
  - none
  - --artifact-dir
  - /results/$(POD_NAME)
  env:
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: CONCURRENCIES
    value: 1,2,4,8
  - name: DATASET_ENTRIES
    value: '16'
  - name: API_URL
    value: http://transformers-base:8000
  - name: MODEL_ID
    value: HuggingFaceTB/SmolLM2-135M-Instruct
  image: local/aiperf:0.12.0
  imagePullPolicy: Never
  name: aiperf
  resources:
    limits:
      cpu: '1'
      memory: 1Gi
    requests:
      cpu: '1'
      memory: 1Gi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
  volumeMounts:
  - mountPath: /tokenizer
    name: tokenizer
    readOnly: true
  - mountPath: /results
    name: results
  - mountPath: /tmp
    name: tmp
persistence:
  name: aiperf-results
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
    storageClassName: standard
reader:
  automountServiceAccountToken: false
  containers:
  - command:
    - sh
    - -c
    - while :; do sleep 3600; done
    image: busybox:1.37.0
    imagePullPolicy: IfNotPresent
    name: reader
    resources:
      limits:
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
    - mountPath: /results
      name: results
      readOnly: true
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
  volumes:
  - name: results
    persistentVolumeClaim:
      claimName: aiperf-results
