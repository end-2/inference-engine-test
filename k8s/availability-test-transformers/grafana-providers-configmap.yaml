apiVersion: v1
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: availability
        folder: Availability
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
kind: ConfigMap
metadata:
  name: grafana-providers
  namespace: availability-test-transformers
