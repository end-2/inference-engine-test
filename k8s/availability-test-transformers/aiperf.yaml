apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiperf-results
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiperf
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiperf
  template:
    metadata:
      labels:
        app: aiperf
    spec:
      nodeSelector:
        workload: monitor
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: aiperf
          image: local/aiperf:0.12.0
          imagePullPolicy: Never
          command: [sh, /runner/run.sh]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUN_SECONDS
              value: "3600"
          args:
            - profile
            - --model
            - HuggingFaceTB/SmolLM2-135M-Instruct
            - --tokenizer
            - /tokenizer
            - --url
            - http://transformers-base-metric:8000
            - --endpoint-type
            - chat
            - --streaming
            - --use-server-token-count
            - --connection-reuse-strategy
            - never
            - --sequence-distribution
            - "64,32:50;256,64:50"
            - --num-dataset-entries
            - "16"
            - --random-seed
            - "42"
            - --dataset-sampling-strategy
            - sequential
            - --extra-inputs
            - ignore_eos:true
            - --concurrency
            - "4"
            - --workers-max
            - "1"
            - --request-timeout-seconds
            - "30"
            - --benchmark-grace-period
            - "35"
            - --export-level
            - records
            - --slice-duration
            - "5"
            - --no-server-metrics
            - --ui
            - none
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runner
              mountPath: /runner
              readOnly: true
            - name: tokenizer
              mountPath: /tokenizer
              readOnly: true
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runner
          configMap:
            name: aiperf-runner
        - name: tokenizer
          hostPath:
            path: /models/smollm2-135m
            type: Directory
        - name: results
          persistentVolumeClaim:
            claimName: aiperf-results
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: aiperf-results
spec:
  nodeSelector:
    workload: monitor
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: reader
      image: busybox:1.37.0
      command: [sh, -c, "while :; do sleep 3600; done"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 10m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: results
          mountPath: /results
          readOnly: true
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: aiperf-results
