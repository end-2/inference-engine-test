apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Upstream: https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.1/components.yaml
resources:
  - components.yaml
patches:
  - target:
      kind: Deployment
      name: metrics-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
      - op: add
        path: /spec/template/spec/nodeSelector/workload
        value: monitor
      - op: add
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 100m
          memory: 200Mi
