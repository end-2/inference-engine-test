apiVersion: apps/v1
kind: Deployment
metadata:
  name: transformers-base
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transformers-base
  template:
    metadata:
      labels:
        app: transformers-base
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: api
          image: local/transformers-base:0.1.0
          imagePullPolicy: Never
          args:
            - --model
            - /model
            - --served-model-name
            - HuggingFaceTB/SmolLM2-135M-Instruct
            - --n-threads
            - "4"
            - --dtype
            - float32
            - --n-ctx
            - "1024"
            - --max-input-tokens
            - "768"
            - --max-output-tokens
            - "128"
            - --default-output-tokens
            - "32"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "8"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model
          hostPath:
            path: /models/smollm2-135m
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
