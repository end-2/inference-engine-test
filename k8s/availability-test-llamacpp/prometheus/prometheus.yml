global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: kube-state-metrics
    honor_labels: true
    static_configs:
      - targets: [kube-state-metrics:8080]
  - job_name: base-metric-llamacpp
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: [availability-test-llamacpp]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: base-metric-llamacpp
      - source_labels: [__meta_kubernetes_endpointslice_port_name]
        action: keep
        regex: http
      # Keep unready endpoints to observe scrape failures before endpoint removal.
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_endpointslice_endpoint_node_name]
        target_label: node
