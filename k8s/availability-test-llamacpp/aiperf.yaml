apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiperf-results
  namespace: availability-test-llamacpp
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiperf
  namespace: availability-test-llamacpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiperf
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: aiperf
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - profile
        - --model
        - Qwen/Qwen2.5-0.5B-Instruct
        - --tokenizer
        - /tokenizer
        - --url
        - http://base-metric-llamacpp:8000
        - --endpoint-type
        - chat
        - --streaming
        - --use-server-token-count
        - --connection-reuse-strategy
        - never
        - --sequence-distribution
        - 64,32:50;256,64:50
        - --num-dataset-entries
        - "16"
        - --random-seed
        - "42"
        - --dataset-sampling-strategy
        - sequential
        - --extra-inputs
        - ignore_eos:true
        - --concurrency
        - "4"
        - --workers-max
        - "1"
        - --request-timeout-seconds
        - "30"
        - --benchmark-grace-period
        - "35"
        - --export-level
        - records
        - --slice-duration
        - "5"
        - --no-server-metrics
        - --ui
        - none
        command:
        - sh
        - /runner/run.sh
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RUN_SECONDS
          value: "3600"
        image: local/aiperf:0.12.0
        imagePullPolicy: Never
        name: aiperf
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /runner
          name: runner
          readOnly: true
        - mountPath: /tokenizer
          name: tokenizer
          readOnly: true
        - mountPath: /results
          name: results
        - mountPath: /tmp
          name: tmp
      nodeSelector:
        workload: monitor
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 120
      volumes:
      - configMap:
          name: aiperf-runner
        name: runner
      - hostPath:
          path: /models/qwen2.5-0.5b/tokenizer
          type: Directory
        name: tokenizer
      - name: results
        persistentVolumeClaim:
          claimName: aiperf-results
      - emptyDir:
          sizeLimit: 1Gi
        name: tmp
---
apiVersion: v1
kind: Pod
metadata:
  name: aiperf-results
  namespace: availability-test-llamacpp
spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - sh
    - -c
    - while :; do sleep 3600; done
    image: busybox:1.37.0
    name: reader
    resources:
      limits:
        cpu: 10m
        memory: 32Mi
      requests:
        cpu: 10m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
    - mountPath: /results
      name: results
      readOnly: true
  nodeSelector:
    workload: monitor
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
  volumes:
  - name: results
    persistentVolumeClaim:
      claimName: aiperf-results
