groups:
  - name: hpa
    rules:
      - record: hpa:service_ready_endpoints
        expr: |
          sum by (namespace, service) (
            kube_endpointslice_endpoints{namespace="{{ .Values.namespace }}",ready="true"}
            * on (namespace, endpointslice) group_left (service)
            label_replace(kube_endpointslice_labels{namespace="{{ .Values.namespace }}"}, "service", "$1", "label_kubernetes_io_service_name", "(.+)")
          )
          or on (namespace, service)
          (0 * max by (namespace, service) (kube_service_info{namespace="{{ .Values.namespace }}"}))
      - record: hpa:service_unready_endpoints
        expr: |
          sum by (namespace, service) (
            kube_endpointslice_endpoints{namespace="{{ .Values.namespace }}",ready!="true"}
            * on (namespace, endpointslice) group_left (service)
            label_replace(kube_endpointslice_labels{namespace="{{ .Values.namespace }}"}, "service", "$1", "label_kubernetes_io_service_name", "(.+)")
          )
          or on (namespace, service)
          (0 * max by (namespace, service) (kube_service_info{namespace="{{ .Values.namespace }}"}))
