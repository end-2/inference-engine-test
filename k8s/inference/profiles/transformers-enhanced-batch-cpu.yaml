podLabels:
  inference-variant: enhanced-batch
container:
  image: local/transformers-enhanced-batch:0.1.0
  args:
  - --model
  - /model
  - --served-model-name
  - HuggingFaceTB/SmolLM2-135M-Instruct
  - --n-threads
  - '4'
  - --max-parallel
  - '4'
  - --batch-wait-ms
  - '5'
  - --dtype
  - float32
  - --n-ctx
  - '1024'
  - --max-input-tokens
  - '768'
  - --max-output-tokens
  - '128'
  - --default-output-tokens
  - '32'
