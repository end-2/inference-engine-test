name: base-llamacpp
podLabels:
  inference-variant: enhanced-cache
pod:
  securityContext:
    fsGroup: 1000
  volumes:
  - name: model
    hostPath:
      path: /models/qwen2.5-0.5b
      type: Directory
  - name: tmp
    emptyDir:
      sizeLimit: 1Gi
  - name: cache
    persistentVolumeClaim:
      claimName: enhanced-cache-llamacpp
  runtimeClassName: nvidia
container:
  image: local/enhanced-cache-llamacpp-gpu:0.1.0
  args:
  - --model
  - /model/qwen2.5-0.5b-instruct-q4_k_m.gguf
  - --served-model-name
  - Qwen/Qwen2.5-0.5B-Instruct
  - --n-threads
  - '4'
  - --cache-dir
  - /cache
  - --cache-ram-mib
  - '64'
  - --cache-disk-mib
  - '1024'
  - --cache-min-prefix
  - '32'
  - --n-ctx
  - '1024'
  - --max-input-tokens
  - '768'
  - --max-output-tokens
  - '128'
  - --default-output-tokens
  - '32'
  - --n-gpu-layers
  - '-1'
  resources:
    requests:
      cpu: '4'
      memory: 4Gi
      nvidia.com/gpu: 1
    limits:
      cpu: '4'
      memory: 4Gi
      nvidia.com/gpu: 1
  volumeMounts:
  - name: model
    mountPath: /model
    readOnly: true
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /cache
cache:
  enabled: true
  name: enhanced-cache-llamacpp
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
