podLabels:
  inference-variant: enhanced-cache
pod:
  securityContext:
    fsGroup: 1000
  volumes:
  - name: model
    hostPath:
      path: /models/smollm2-135m
      type: Directory
  - name: tmp
    emptyDir:
      sizeLimit: 1Gi
  - name: cache
    persistentVolumeClaim:
      claimName: transformers-enhanced-cache
container:
  image: local/transformers-enhanced-cache:0.1.0
  args:
  - --model
  - /model
  - --served-model-name
  - HuggingFaceTB/SmolLM2-135M-Instruct
  - --n-threads
  - '4'
  - --cache-dir
  - /cache
  - --cache-ram-mib
  - '64'
  - --cache-disk-mib
  - '1024'
  - --cache-min-prefix
  - '32'
  - --dtype
  - float32
  - --n-ctx
  - '1024'
  - --max-input-tokens
  - '768'
  - --max-output-tokens
  - '128'
  - --default-output-tokens
  - '32'
  volumeMounts:
  - name: model
    mountPath: /model
    readOnly: true
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /cache
cache:
  enabled: true
  name: transformers-enhanced-cache
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
