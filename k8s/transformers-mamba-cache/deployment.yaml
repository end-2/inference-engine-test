apiVersion: apps/v1
kind: Deployment
metadata:
  name: transformers-mamba-base
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transformers-mamba-base
  template:
    metadata:
      labels:
        app: transformers-mamba-base
        inference-variant: mamba-cache
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: local/transformers-mamba-cache:0.1.0
          imagePullPolicy: Never
          args:
            - --model
            - /model
            - --served-model-name
            - state-spaces/mamba-130m-hf
            - --n-threads
            - "4"
            - --cache-dir
            - /cache
            - --cache-ram-mib
            - "64"
            - --cache-disk-mib
            - "1024"
            - --cache-min-prefix
            - "32"
            - --dtype
            - float32
            - --n-ctx
            - "1024"
            - --max-input-tokens
            - "768"
            - --max-output-tokens
            - "128"
            - --default-output-tokens
            - "32"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "8"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /cache
      volumes:
        - name: model
          hostPath:
            path: /models/mamba-130m
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: cache
          persistentVolumeClaim:
            claimName: transformers-mamba-cache
