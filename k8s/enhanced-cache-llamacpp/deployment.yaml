apiVersion: apps/v1
kind: Deployment
metadata:
  name: base-llamacpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: base-llamacpp
  template:
    metadata:
      labels:
        app: base-llamacpp
        inference-variant: enhanced-cache
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: local/enhanced-cache-llamacpp:0.1.0
          imagePullPolicy: Never
          args:
            - --model
            - /model/qwen2.5-0.5b-instruct-q4_k_m.gguf
            - --served-model-name
            - Qwen/Qwen2.5-0.5B-Instruct
            - --n-threads
            - "12"
            - --cache-dir
            - /cache
            - --cache-ram-mib
            - "64"
            - --cache-disk-mib
            - "1024"
            - --cache-min-prefix
            - "32"
            - --n-ctx
            - "1024"
            - --max-input-tokens
            - "768"
            - --max-output-tokens
            - "128"
            - --default-output-tokens
            - "32"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "12"
              memory: 16Gi
            limits:
              cpu: "12"
              memory: 16Gi
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /cache
      volumes:
        - name: model
          hostPath:
            path: /models/qwen2.5-0.5b
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: cache
          persistentVolumeClaim:
            claimName: enhanced-cache-llamacpp
