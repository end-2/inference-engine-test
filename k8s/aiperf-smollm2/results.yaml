apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiperf-results
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
---
apiVersion: v1
kind: Pod
metadata:
  name: aiperf-results
spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - sh
    - -c
    - while :; do sleep 3600; done
    image: busybox:1.37.0
    imagePullPolicy: IfNotPresent
    name: reader
    resources:
      limits:
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
    - mountPath: /results
      name: results
      readOnly: true
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
  volumes:
  - name: results
    persistentVolumeClaim:
      claimName: aiperf-results
