apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../aiperf-qwen2.5/base
nameSuffix: "-128-qwen2.5"
patches:
  - target:
      kind: Job
      name: aiperf
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: aiperf
      spec:
        template:
          spec:
            containers:
              - name: aiperf
                env:
                  - name: DATASET_ENTRIES
                    value: "128"
