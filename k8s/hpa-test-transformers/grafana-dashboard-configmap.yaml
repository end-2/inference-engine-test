apiVersion: v1
data:
  availability.json: |
    {
      "uid": "hpa-test-transformers",
      "title": "CPU HPA scale-out and scale-in",
      "tags": [
        "hpa"
      ],
      "timezone": "utc",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "5s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "editable": false,
      "panels": [
        {
          "id": 1,
          "title": "CPU utilization / request",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_target_metric{namespace=\"hpa-test-transformers\",horizontalpodautoscaler=\"transformers-base-metric\",metric_name=\"cpu\",metric_target_type=\"utilization\"}",
              "legendFormat": "observed"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_spec_target_metric{namespace=\"hpa-test-transformers\",horizontalpodautoscaler=\"transformers-base-metric\",metric_name=\"cpu\",metric_target_type=\"utilization\"}",
              "legendFormat": "target"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 2,
          "title": "HPA replicas and available Pods",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"hpa-test-transformers\",horizontalpodautoscaler=\"transformers-base-metric\"}",
              "legendFormat": "desired"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"hpa-test-transformers\",horizontalpodautoscaler=\"transformers-base-metric\"}",
              "legendFormat": "current"
            },
            {
              "refId": "C",
              "expr": "kube_deployment_status_replicas_available{namespace=\"hpa-test-transformers\",deployment=\"transformers-base-metric\"}",
              "legendFormat": "available"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 3,
          "title": "Service ready endpoints",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "hpa:service_ready_endpoints{namespace=\"hpa-test-transformers\",service=\"transformers-base-metric\"}",
              "legendFormat": "ready"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 4,
          "title": "HPA conditions",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_condition{namespace=\"hpa-test-transformers\",horizontalpodautoscaler=\"transformers-base-metric\",status=\"true\"}",
              "legendFormat": "{{condition}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 5,
          "title": "Completed requests / second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (outcome) (rate(transformers_requests_total{namespace=\"hpa-test-transformers\"}[1m]))",
              "legendFormat": "{{outcome}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 6,
          "title": "In-flight requests by Pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "transformers_requests_in_flight{namespace=\"hpa-test-transformers\"}",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 7,
          "title": "Server TTFT p95",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(transformers_time_to_first_token_seconds_bucket{namespace=\"hpa-test-transformers\"}[1m])))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 8,
          "title": "Completion tokens / second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(transformers_tokens_total{namespace=\"hpa-test-transformers\",kind=\"completion\"}[1m]))",
              "legendFormat": "tokens/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: hpa-test-transformers
