apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pd-results
  namespace: pd-comparison
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pd-benchmark
  namespace: pd-comparison
  labels:
    app: pd-benchmark
spec:
  activeDeadlineSeconds: 14400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: pd-benchmark
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - profile
        - --model
        - $(MODEL_ID)
        - --tokenizer
        - /tokenizer
        - --url
        - $(API_URL)
        - --endpoint-type
        - chat
        - --streaming
        - --use-server-token-count
        - --sequence-distribution
        - 64,128:50;512,32:50
        - --num-dataset-entries
        - $(DATASET_ENTRIES)
        - --random-seed
        - '42'
        - --parameter-sweep-same-seed
        - --dataset-sampling-strategy
        - sequential
        - --extra-inputs
        - ignore_eos:true
        - --concurrency
        - $(CONCURRENCIES)
        - --workers-max
        - '1'
        - --warmup-request-count
        - '4'
        - --warmup-concurrency
        - '1'
        - --request-count
        - '100'
        - --request-timeout-seconds
        - '120'
        - --no-server-metrics
        - --ui
        - none
        - --artifact-dir
        - /results/$(POD_NAME)
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONCURRENCIES
          value: 1,2,4,8
        - name: DATASET_ENTRIES
          value: '16'
        - name: API_URL
          value: http://pd-router:8000
        - name: MODEL_ID
          value: HuggingFaceTB/SmolLM2-135M-Instruct
        image: local/aiperf:0.12.0
        imagePullPolicy: Never
        name: aiperf
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tokenizer
          name: tokenizer
          readOnly: true
        - mountPath: /results
          name: results
        - mountPath: /tmp
          name: tmp
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 60
      volumes:
      - hostPath:
          path: /models/smollm2-135m
          type: Directory
        name: tokenizer
      - name: results
        persistentVolumeClaim:
          claimName: pd-results
      - emptyDir:
          sizeLimit: 1Gi
        name: tmp
      nodeSelector:
        nvidia.com/mps.capable: 'true'
  ttlSecondsAfterFinished: 3600
