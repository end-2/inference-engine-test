apiVersion: v1
kind: Pod
metadata:
  name: pd-results
  namespace: pd-comparison
spec:
  automountServiceAccountToken: false
  nodeSelector:
    nvidia.com/mps.capable: "true"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
  - name: results
    image: busybox:1.37.0
    command: [sleep, "3600"]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: results
      mountPath: /results
      readOnly: true
  volumes:
  - name: results
    persistentVolumeClaim:
      claimName: pd-results
  restartPolicy: Never
