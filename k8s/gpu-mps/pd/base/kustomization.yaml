apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pd-comparison
resources:
- router.yaml
configMapGenerator:
- name: pd-settings
  literals:
  - MODEL_ID=HuggingFaceTB/SmolLM2-135M-Instruct
  - N_CTX=1024
  - MAX_INPUT_TOKENS=768
  - MAX_OUTPUT_TOKENS=256
  - MAX_PENDING=8
  - MAX_STATE_MIB=64
  - MAX_STATE_TRANSFERS=2
  - OMP_NUM_THREADS=2
