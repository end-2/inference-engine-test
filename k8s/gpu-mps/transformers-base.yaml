apiVersion: apps/v1
kind: Deployment
metadata:
  name: transformers-mps
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transformers-mps
  template:
    metadata:
      labels:
        app: transformers-mps
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: api
        image: local/transformers-base-gpu:0.1.0
        imagePullPolicy: Never
        args:
        - --model
        - /model
        - --served-model-name
        - HuggingFaceTB/SmolLM2-135M-Instruct
        - --n-threads
        - '2'
        - --dtype
        - float16
        - --n-ctx
        - '1024'
        - --max-input-tokens
        - '768'
        - --max-output-tokens
        - '128'
        - --default-output-tokens
        - '32'
        - --device
        - cuda
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
            nvidia.com/gpu.shared: 1
          limits:
            cpu: '2'
            memory: 2Gi
            nvidia.com/gpu.shared: 1
        volumeMounts:
        - name: model
          mountPath: /model
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: model
        hostPath:
          path: /models/smollm2-135m
          type: Directory
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/mps.capable: 'true'
---
apiVersion: v1
kind: Service
metadata:
  name: transformers-mps
spec:
  selector:
    app: transformers-mps
  ports:
  - name: http
    port: 8000
    targetPort: http
